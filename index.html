<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Index</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>OC Genetics Calculator</h1>

        <div class="whole">
            <table class="simple">
                <tr>
                    <th></th>
                    <th id="first-allele"></th>
                    <th id="second-allele"></th>
                </tr>

                <tr>
                    <th id="third-allele"></th>
                    <td id="calc-one"></td>
                    <td id="calc-two"></td>
                </tr>
                <tr>
                    <th id="fourth-allele"></th>
                    <td id="calc-three"></td>
                    <td id="calc-four"></td>
                </tr>

            </table>
        

        <!--
        <div>
            <h3>Genotypes</h3>
            <input id="first-geno" type="text" placeholder="first geno">
            <input id="second-geno" type="text" placeholder="second geno">
        </div>
        -->
        <div class="parents">
            <div id="parent1">
                <h2>Parent 1</h2>
                <h3>Genetic composition</h3>
                <button id="pure1" type="button">Purebreed</button>
                <button id="half1" type="button">Halfbreed</button>
                <input id="geno1" type="text" placeholder="genotype">

            </div>

            <div id="parent2">
                <h2>Parent 2</h2>
                <h3>Genetic composition</h3>
                <button id="pure2" type="button">Purebreed</button>
                <button id="half2" type="button">Halfbreed</button>
                <input id="geno2" type="text" placeholder="genotype">

            </div>
        </div>


        <div class="pheno-assign">
            <h3>Phenotypes assigned</h3>
                <input id="pheno1" type="text" placeholder="characteristic">
                <input id="pheno2" type="text" placeholder="other characteristic">
          
        </div>


        <script src="script.js"></script>
    </body>


</html>
